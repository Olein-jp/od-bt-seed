name: WordPress テーマをリリース

on:
  push:
    tags:
      - 'v*'

jobs:
  check:
    uses: ./.github/workflows/theme-check.yml
    permissions:
      contents: read
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: main 上のコミットであることを確認
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: インストール用 ZIP を生成
        run: python3 scripts/package-theme.py "$GITHUB_REF_NAME" dist
      - name: GitHub Releases に公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/od-bt-seed-$GITHUB_REF_NAME.zip" --verify-tag --generate-notes
